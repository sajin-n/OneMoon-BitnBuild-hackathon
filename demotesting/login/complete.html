<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Verified - Apex Staff Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f1f3f5;
      color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header-bar {
      background: #ffffff;
      border-bottom: 1px solid #dee2e6;
      padding: 10px 24px;
    }
    .header-brand {
      font-size: 16px;
      font-weight: 700;
      color: #1e3a8a;
    }
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #15803d;
      margin-bottom: 10px;
    }
    p {
      color: #4b5563;
      font-size: 13.5px;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #0056b3;
      color: #ffffff;
      text-decoration: none;
      padding: 9px;
      border-radius: 3px;
      font-size: 14px;
      font-weight: 600;
    }
    .btn:hover {
      background: #004494;
    }
  </style>
</head>
<body>
  <header class="header-bar">
    <div class="header-brand">Apex Staff Portal</div>
  </header>
  <main class="main-wrap">
    <div class="box">
      <h1>Identity Verified Successfully</h1>
      <p>Your session has been restored. You can now access your staff services.</p>
      <a href="/secure-account-verification/login?session=expired&verify=1" class="btn">
        Return to Portal
      </a>
    </div>
  </main>
</body>
</html>
